name: kaartcatalogus-tests

# Alleen vaste testbestanden; de live controle staat in catalogue-health.yml.
on:
  pull_request:
    paths:
      - "tools/check_map_services.py"
      - "tests/test_catalogue_health.py"
      - "tests/fixtures/catalogue-health/**"
      - ".github/workflows/catalogue-health*.yml"
  push:
    branches: [main]
    paths:
      - "tools/check_map_services.py"
      - "tests/test_catalogue_health.py"
      - "tests/fixtures/catalogue-health/**"
      - ".github/workflows/catalogue-health*.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-kaartcatalogus:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m unittest discover -s tests -p 'test_catalogue_health.py' -v
