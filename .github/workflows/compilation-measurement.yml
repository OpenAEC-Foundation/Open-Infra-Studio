name: Windows compilation output comparison

# Temporary proof; removed before this PR is ready. No signing or publication.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"

jobs:
  compare:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 6566016ac75cffcf6ba22e6dde9b06ec9e00cf03
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
      - name: Build with no target cache
        shell: bash
        run: |
          test ! -d target/debug/.fingerprint
          test ! -d target/release/.fingerprint
          mkdir -p measurements
          cargo test --lib --locked -p open-infra
          cargo build --release --locked -p open-infra
          cp target/release/open_infra.dll measurements/cold-gis.dll
          cargo build --release --locked -p open-infra-civiel
          cp target/release/open_infra_civiel.dll measurements/cold-civiel.dll
      - name: Rebuild the workspace while reusing dependencies
        shell: bash
        run: |
          cargo clean -p open-infra -p open-infra-civiel
          cargo test --lib --locked -p open-infra
          cargo build --release --locked -p open-infra
          cp target/release/open_infra.dll measurements/warm-gis.dll
          cargo build --release --locked -p open-infra-civiel
          cp target/release/open_infra_civiel.dll measurements/warm-civiel.dll
      - name: Compare all bytes except bounded PE linker metadata
        shell: bash
        run: |
          python - <<'PY'
          """Vergelijk PE-bestanden; negeer uitsluitend vastgelegde linkmetadata."""
          import hashlib
          import struct


          def pe_metadata_ranges(data):
              def u16(offset): return struct.unpack_from('<H', data, offset)[0]
              def u32(offset): return struct.unpack_from('<I', data, offset)[0]
              assert data[:2] == b'MZ'
              pe = u32(0x3c)
              assert data[pe:pe+4] == b'PE\0\0'
              coff = pe + 4
              optional = coff + 20
              magic = u16(optional)
              assert magic in (0x10b, 0x20b)
              directories = optional + (112 if magic == 0x20b else 96)
              section_table = optional + u16(coff + 16)
              sections = []
              for i in range(u16(coff + 2)):
                  entry = section_table + i * 40
                  name = data[entry:entry+8].split(b'\0',1)[0].decode('ascii')
                  virtual_size, rva, raw_size, raw = struct.unpack_from('<IIII', data, entry + 8)
                  assert raw + raw_size <= len(data)
                  sections.append((name, rva, max(virtual_size,raw_size), raw, raw_size))
              def file_offset(rva):
                  for _, address, size, raw, raw_size in sections:
                      if address <= rva < address + size:
                          offset = raw + rva - address
                          assert offset < raw + raw_size
                          return offset
                  raise AssertionError(f'RVA buiten secties: {rva}')
              ranges = [('coff_timestamp', coff + 4, 4), ('pe_checksum', optional + 64, 4)]
              export_rva = u32(directories)
              if export_rva:
                  ranges.append(('export_timestamp', file_offset(export_rva) + 4, 4))
              debug_rva, debug_size = struct.unpack_from('<II',data,directories + 6*8)
              debug_types=[]
              if debug_rva:
                  assert debug_size % 28 == 0
                  debug = file_offset(debug_rva)
                  for i in range(debug_size // 28):
                      entry=debug+i*28
                      kind, size, _, raw = struct.unpack_from('<IIII',data,entry+12)
                      assert raw+size<=len(data)
                      ranges.append((f'debug_{i}_timestamp',entry+4,4))
                      debug_types.append(kind)
                      if kind == 2 and size >= 24 and data[raw:raw+4] == b'RSDS':
                          ranges.append((f'debug_{i}_codeview_guid_age',raw+4,20))
                      elif kind == 16:
                          assert size<=1024
                          if size: ranges.append((f'debug_{i}_repro_digest',raw,size))
              for _, start,size in ranges:
                  assert start+size<=len(data)
              return ranges, sections, debug_types


          def compare_pe(before,after):
              ranges, sections, debug_types=pe_metadata_ranges(before)
              after_ranges, after_sections, after_types=pe_metadata_ranges(after)
              assert (ranges,sections,debug_types)==(after_ranges,after_sections,after_types)
              assert len(before)==len(after)
              original, rebuilt=bytearray(before),bytearray(after)
              differences=[]
              for name,start,size in ranges:
                  a,b=before[start:start+size],after[start:start+size]
                  if a!=b: differences.append({'field':name,'offset':start,'bytes':size,'before':a.hex(),'after':b.hex()})
                  original[start:start+size]=b'\0'*size
                  rebuilt[start:start+size]=b'\0'*size
              normalized_equal=original==rebuilt
              result={'bytes':len(before),'raw_equal':before==after,'normalized_equal':normalized_equal,
                      'before_sha256':hashlib.sha256(before).hexdigest(),'after_sha256':hashlib.sha256(after).hexdigest(),
                      'normalized_before_sha256':hashlib.sha256(original).hexdigest(),
                      'normalized_after_sha256':hashlib.sha256(rebuilt).hexdigest(),
                      'metadata_differences':differences,'debug_types':debug_types,
                      'sections': [{'name':name,'raw_bytes':size} for name,_,_,_,size in sections]}
              return result

          from pathlib import Path
          import json, subprocess
          results = {}
          for name, current in [('gis', 'open_infra.dll'), ('civiel', 'open_infra_civiel.dll')]:
              results[name] = compare_pe(Path(f'measurements/cold-{name}.dll').read_bytes(), Path(f'measurements/warm-{name}.dll').read_bytes())
          results['source'] = subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          results['rustc'] = subprocess.check_output(['rustc','-Vv'],text=True)
          Path('measurements/windows-link-metadata.json').write_text(json.dumps(results,indent=2),encoding='utf-8')
          print('WINDOWS_LINK_METADATA=' + json.dumps(results))
          assert all(results[name]['normalized_equal'] for name in ['gis','civiel']), 'Verschil buiten linkeridentiteit, tijdstempels of checksum'
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-link-metadata
          path: measurements/windows-link-metadata.json
