name: test

# Offline tests (engine, NLCS, location set without network) on every push
# and pull request. The online location test fetches real data from PDOK,
# OpenStreetMap and AHN for every test location: weekly and on request, with
# the report as an artifact.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

env:
  RUST_TOOLCHAIN: "1.99.1"

jobs:
  offline:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      # Keyed by rustc, manifests, lockfile and compiler environment. Only
      # dependencies are cached; workspace crates and test output are rebuilt.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: test
          cache-bin: false
      # Validate the development profile across every offline Rust test target.
      # Network-dependent tests remain ignored by the normal test harness.
      - run: cargo test --lib --tests --locked -p open-infra
      # The IFC 4.3 export of the sample drawing (written by the unit tests),
      # checked by IfcOpenShell: schema, EXPRESS rules, alignment geometry.
      - run: pip install "ifcopenshell==0.8.4.post1" pytest
      - run: python3 tests/ifc_validate.py target/ifc-test/voorbeeld.ifc
      - run: python3 -m unittest discover -s tests -p 'test*.py'
      # The Civiel plugin builds on the same engine.
      - run: cargo check --locked -p open-infra-civiel
      - run: python3 -m py_compile mcp/open_infra_mcp.py

  online:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: test
          cache-bin: false
      - run: cargo test --test locaties --locked -p open-infra -- --ignored --nocapture
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: locatietest-rapport
          path: target/locatietest/
