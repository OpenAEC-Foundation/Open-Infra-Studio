name: test

# Offline tests (engine, NLCS, location set without network) on every push
# and pull request. The online location test fetches real data from PDOK,
# OpenStreetMap and AHN for every test location: weekly and on request, with
# the report as an artifact.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

env:
  RUST_TOOLCHAIN: "1.99.1"

jobs:
  offline:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      # Keyed by rustc, manifests, lockfile and compiler environment. Only
      # dependencies are cached; workspace crates and test output are rebuilt.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: test
          cache-bin: false
      # Validate the development profile across every offline Rust test target.
      # Fixed local DWGs and boundary cases use the same writer as GIS_IFC /
      # CIV_IFC. Network-dependent tests remain ignored by the normal harness.
      - run: cargo test --lib --tests --locked -p open-infra -p nlcspp
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m pip install -r tests/requirements-ifc.txt
      - name: IFC 4.3 schema, EXPRESS, alignment geometry and IDS
        run: python3 tests/ifc_suite.py target/ifc-test --report target/ifc-test/validatie.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ifc43-validatie-${{ github.sha }}
          path: |
            target/ifc-test/*.ifc
            target/ifc-test/validatie.json
      - run: python3 -m unittest discover -s tests -p 'test*.py'
      # The Civiel plugin builds on the same engine.
      - run: cargo check --locked -p open-infra-civiel
      - run: python3 -m py_compile mcp/open_infra_mcp.py
      - name: Validate excavation regression exports
        run: |
          python3 tests/ifc_validate.py target/ifc-test/ontgraving-ingeklapt-terrein.ifc
          python3 tests/ifc_validate.py target/ifc-test/ontgraving-terreinomtrek.ifc

  online:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: test
          cache-bin: false
      - run: cargo test --test locaties --locked -p open-infra -- --ignored --nocapture
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: locatietest-rapport
          path: target/locatietest/
