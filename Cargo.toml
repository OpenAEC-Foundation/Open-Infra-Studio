[package]
name = "open-infra"
version = "2026.45.3"
edition = "2021"
description = "Open Infra — GIS-workbench voor Open CAD Studio (infra en civiele techniek, NL en wereldwijd)."
license = "GPL-3.0-only"
repository = "https://github.com/OpenAEC-Foundation/Open-Infra-Studio"

[lib]
# cdylib: the GIS plugin the host loads; rlib: the engine for `cargo test`
# and for the Civiel plugin (civiel/).
crate-type = ["cdylib", "rlib"]

[features]
# The plugin entry points. The Civiel plugin links this crate without them,
# so build the two plugins with separate `cargo build -p …` runs.
default = ["plugin"]
plugin = []
# Expose the windows to the desktop's accessibility bus (AT-SPI), so
# tests/e2e/ui_knoppen.py can find and click every button.
ui-test = ["eframe/accesskit"]

[workspace]
members = [".", "civiel"]

[dependencies]
# Stable host contract, pinned to the Open CAD Studio v2026.44 release tag (API 14).
# From API 14 the plugin runs its own runner loop: the host no longer compares
# compiler and opencadcodec commit, only the shape of the types on the wire.
ocs_plugin_api = { git = "https://github.com/HakanSeven12/OpenCADStudio", rev = "537ab37095b681cab899c1cf48b2927d06e194b9", features = ["host"] }

# GIS engine
proj4rs = "0.2"
ureq = "3"
roxmltree = "0.21"
quick-xml = "0.41"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
# Large drawings: entities of the host's shared-memory view are bincode-encoded
bincode = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# KLIC (IMKL 2.0) reader from the OpenAEC crates warehouse (MIT)
klic2geo = { git = "https://github.com/OpenAEC-Foundation/crates-warehouse" }
# Local date for the title block
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# AHN: height grids (WCS GeoTIFF float32) and point clouds (COPC)
tiff = "0.11"
# copc-rs from git: the released 0.5 does not build against las 0.9.11 and
# laz 0.12, which pointcloud-core needs (fixed upstream, not yet released).
copc-rs = { git = "https://github.com/pka/copc-rs", rev = "1cff2a6be1f4d9a421610c22268af2a920cee1c8" }
# Local GIS files: Shapefile, GeoPackage (SQLite, built in), KMZ (zip)
shapefile = "0.9"
rusqlite = { version = "0.41", features = ["bundled"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
# Point cloud files (LAS/LAZ) and their CRS: the versions copc-rs uses
las = { version = "0.9.5", features = ["laz"] }
las-crs = "0.1"
# Civil: TIN (Delaunay) for terrain from survey points
delaunator = "1"
# 3D: triangulating planar polygons with holes (3D BAG surfaces, BGT areas)
earcutr = "0.4"
# Point clouds (Civiel → Puntenwolk): the E57, PLY, PTS and XYZ readers and
# the closed mesher of OpenAEC's Open Pointcloud Studio (LGPL-3.0-or-later,
# a GUI-free crate), and the E57 coordinate metadata (MIT).
pointcloud-core = { git = "https://github.com/OpenAEC-Foundation/open-pointcloud-studio", rev = "b2735904020f38530376c26ce15ebf617021d429", default-features = false }
e57 = "0.11"

# Workbench window (runs in the plugin process, beside the host)
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
winit = "0.30"
egui_extras = { version = "0.37", default-features = false, features = ["svg"] }

[profile.dev]
# Keep file/line backtraces without generating full type and variable debug
# information. Tests inherit this profile; distribution builds do not.
debug = "line-tables-only"

[profile.release]
opt-level = 3

# The ui-test builds (CARGO_TARGET_DIR=target/ui-test … --profile ui-test):
# release speed with function names in backtraces.
[profile.ui-test]
inherits = "release"
debug = "line-tables-only"

# HakanSeven12/acadrust no longer exists (404), but Open CAD Studio v2026.44
# and opencaddocument still name it. hakanaktt/acadrust holds the same commit,
# so fetch it from there (#75). Same commit hash, so the host sees the same codec.
[patch."https://github.com/HakanSeven12/acadrust.git"]
acadrust = { git = "https://github.com/hakanaktt/acadrust.git", rev = "53e6420c4df4d207409798c2719d32fc6cf2811d" }
