[package]
name = "open-infra-civiel"
version = "2026.46.0"
edition = "2021"
description = "Open Infra — Civiel: civiele ontwerptools voor Open CAD Studio (punten, oppervlakken, assen, profielen, grondverzet)."
license = "GPL-3.0-only"
repository = "https://github.com/OpenAEC-Foundation/Open-Infra-Studio"

[lib]
# The Civiel plugin the host loads; its engine lives in open-infra (src/civiel).
crate-type = ["cdylib"]

[dependencies]
# Same released host API as GIS; API 14 checks the codec wire schema.
ocs_plugin_api = { git = "https://github.com/HakanSeven12/OpenCADStudio", rev = "fb0a667e269b6c924233ecd450a11dd7cba40eea", features = ["host"] }
# The engine, without the GIS plugin's entry points.
open-infra = { path = "..", default-features = false }
serde_json = "1"

[features]
# See the GIS plugin's Cargo.toml.
ui-test = ["open-infra/ui-test"]
