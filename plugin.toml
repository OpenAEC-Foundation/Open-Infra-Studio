[plugin]
id = "openaec.open-infra"
name = "Open Infra — GIS"
version = "2026.46.1"
description = "GIS-workbench en NLCS-basisdata voor infra en civiele techniek: projectlocatie, WMS/WFS-servers, OpenStreetMap, BGT, kadaster en KLIC conform NLCS. Nederland (PDOK) en wereldwijd."
author = "OpenAEC Foundation"
license = "GPL-3.0-only"
repository = "OpenAEC-Foundation/Open-Infra-Studio"

[opencad]
api_version = 16
# Filled at build time (scripts/install.sh, release workflow) from the
# compiler that built the library and the acadrust (codec) git source in Cargo.lock.
# API 16 checks the exported API version and codec wire schema at runtime.
rustc_version = "__RUSTC_VERSION__"
acadrust_source = "__ACADRUST_SOURCE__"
ribbon_order = 60
command_prefixes = ["GIS_"]
xdata_apps = ["OPENINFRA"]
