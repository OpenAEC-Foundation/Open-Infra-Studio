[package]
name = "open-infra-web"
version = "2026.44.5"
edition = "2021"
description = "Open Infra — de rekenkern als WebAssembly, voor de webversie van Open CAD Studio (via de besturingskoppeling)."
license = "GPL-3.0-only"
repository = "https://github.com/OpenAEC-Foundation/Open-Infra-Studio"

# Een eigen workspace: de desktop-plugins (en hun lockfile) blijven ongemoeid.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"

[profile.release]
opt-level = "s"
lto = true
